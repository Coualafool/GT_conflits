# GitHub Pages (deploy from branch main) — exclude internal files from the published site.
# Le kit vit dans kit_peda/ ; la racine ne garde que le shim de redirection index.html.
exclude:
  - kit_peda/interne
  - kit_peda/scripts
  - kit_peda/artifacts
  - kit_peda/.runtime
  - kit_peda/node_modules
  - kit_peda/package.json
  - kit_peda/_runs
