<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>spike vendor three — loading</title>
<style>body{background:#111;color:#eee;font:14px system-ui;margin:0}canvas{display:block}</style>
</head>
<body>
<div id="out" style="padding:8px">spike : sonde cube WebGL under file://</div>
<script>
/* Spike S-A/S-B : charge le build choisi par ?b=a|b (classic script, jamais ESM),
   puis rend un cube éclairé + une étiquette CanvasTexture. Résultat dans window.__probe. */
(function () {
  var b = (new URLSearchParams(location.search).get("b") || "a").toLowerCase();
  var src = b === "b" ? "three.umd.min.js" : "three.bundle.js";
  var s = document.createElement("script");
  s.src = src;
  s.onerror = function () { fail("script " + src + " n'a pas chargé"); };
  s.onload = function () { try { run(); } catch (e) { fail(String(e && e.stack || e)); } };
  document.head.appendChild(s);

  function fail(err) {
    window.__probe = { ok: false, build: b, err: err };
    document.title = "PROBE-FAIL";
    document.getElementById("out").textContent = "FAIL " + b + " : " + err;
  }
  function run() {
    if (!window.THREE) return fail("window.THREE absent");
    var rev = THREE.REVISION;
    var canvas = document.createElement("canvas");
    canvas.width = 320; canvas.height = 240;
    document.body.appendChild(canvas);
    var renderer;
    try {
      renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: false, powerPreference: "low-power" });
    } catch (e) { return fail("WebGLRenderer: " + e); }
    var gl = renderer.getContext();
    if (!gl) return fail("pas de contexte WebGL");
    var glv = gl.getParameter(gl.VERSION);

    var scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x101216, 4, 18);
    var cam = new THREE.PerspectiveCamera(60, 320 / 240, 0.1, 60);
    cam.position.set(0, 1.2, 4.2);
    cam.lookAt(0, 1, 0);

    var cube = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.4, 1.4), new THREE.MeshStandardMaterial({ color: 0xb0763a, roughness: 0.6, metalness: 0.25 }));
    cube.position.y = 1;
    scene.add(cube);

    // étiquette canvas → texture (chemin exact du musée : texte cuit dans la texture)
    var c2 = document.createElement("canvas"); c2.width = 512; c2.height = 128;
    var x = c2.getContext("2d");
    x.fillStyle = "#1a1d22"; x.fillRect(0, 0, 512, 128);
    x.fillStyle = "#e8e2d4"; x.font = "600 44px system-ui"; x.fillText("1948 — test", 20, 80);
    var tex = new THREE.CanvasTexture(c2);
    if (THREE.SRGBColorSpace) tex.colorSpace = THREE.SRGBColorSpace;
    var label = new THREE.Mesh(new THREE.PlaneGeometry(2.4, 0.6), new THREE.MeshBasicMaterial({ map: tex }));
    label.position.set(0, 2.1, 0);
    scene.add(label);

    scene.add(new THREE.HemisphereLight(0xfff2df, 0x1a1d22, 0.55));
    var sp = new THREE.SpotLight(0xffd9a0, 60, 14, 0.7, 0.4, 1.6);
    sp.position.set(2, 5, 3);
    scene.add(sp);

    renderer.setSize(320, 240, false);
    renderer.render(scene, cam);

    // vérifie que la scène a vraiment rendu des pixels (pas un canvas noir)
    var px = new Uint8Array(4 * 64);
    var lit = 0;
    [[96, 40], [40, 150]].forEach(function (p) {
      gl.readPixels(p[0], p[1], 8, 8, gl.RGBA, gl.UNSIGNED_BYTE, px);
      for (var i = 0; i < px.length; i += 4) if (px[i] + px[i + 1] + px[i + 2] > 90) lit++;
    });
    // + raycast (chemin station du musée)
    var rc = new THREE.Raycaster();
    rc.setFromCamera(new THREE.Vector2(0, 0), cam);
    var hit = rc.intersectObject(cube, false).length > 0;

    window.__probe = { ok: lit > 12 && hit, build: b, rev: rev, gl: glv, litPx: lit, raycast: hit };
    document.title = (lit > 12 && hit) ? "PROBE-OK" : "PROBE-BLANK";
    document.getElementById("out").textContent = (lit > 12 && hit ? "OK " : "BLANK ") + b + " : rev " + rev + " · " + glv + " · litPx " + lit + " · raycast " + hit;
  }
})();
</script>
</body>
</html>
